name: CalVer Release

# Unified tag + release + npm publish pipeline for CalVer versions.
#
# Triggered when package.json is modified on main OR alpha. All steps run in
# ONE job so there is no workflow-cascade gap (GITHUB_TOKEN-created tags/releases
# deliberately don't trigger downstream workflows; doing it inline sidesteps
# that rule entirely).
#
# alpha is the soak channel — bumps land there first, then alpha → main for
# stable. Matches the maw-js canonical (#287 surfaced the parity gap).
#
# Secret required: NPM_TOKEN
# Everything else uses the repo's built-in GITHUB_TOKEN with write perms.
#
# Spec: https://github.com/Soul-Brews-Studio/mawjs-oracle/blob/main/%CF%88/inbox/2026-04-18_proposal-calver-skills-cli.md

on:
  push:
    # alpha ONLY. The standing rule is alpha-only releases (CLAUDE.md, 2026-07-25):
    # no alpha->main PRs, no stable cuts, no beta channel. Leaving main and beta
    # armed here made the rule a convention that one stray push could break — and
    # one did: a docs branch accidentally cut from a release branch carried a
    # stable version onto alpha and this workflow happily tagged v26.7.25 off it.
    # Narrowing the trigger makes the rule structural instead of documented.
    branches: [alpha]
    paths:
      - package.json

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: calver-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level so the npm step's `if:` can test it — the env context in a
    # step's `if` cannot see that same step's own `env:` block.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Read + validate version
        id: ver
        run: |
          set -e
          VERSION=$(jq -r '.version' package.json)
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Only act on CalVer-shaped versions. Non-CalVer bumps (legacy v3.x
          # chore commits, etc.) are skipped — no-op, not a failure.
          # Accepts alpha + beta channels (#754); both are prereleases.
          # Suffix is HMM (#766/#923): integer H*100+M, 1-4 digits, no leading
          # zero (e.g. 5, 30, 929, 1200, 2359). Optional trailing [a-z] is the
          # same-minute collision suffix.
          REGEX='^[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,3}(-(alpha|beta)\.[0-9]{1,4}[a-z]?)?$'
          if [[ ! "$VERSION" =~ $REGEX ]]; then
            echo "::notice title=Skipped::Version '$VERSION' is not CalVer — no release cut."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Range validation — regex alone passes month.99.
          BASE="${VERSION%%-*}"
          IFS='.' read -r YY M D <<< "$BASE"
          if (( M < 1 || M > 12 )); then
            echo "::error::Month must be 1-12, got $M"; exit 1
          fi
          # D is a monotonic counter floored at day-of-month; may exceed 31
          # after a multi-cut streak (per #930). Floor-only validation.
          if (( D < 1 )); then
            echo "::error::Day/counter must be ≥1, got $D"; exit 1
          fi

          PRERELEASE="false"
          CHANNEL="stable"
          NPM_TAG="latest"
          if [[ "$VERSION" == *-alpha.* ]] || [[ "$VERSION" == *-beta.* ]]; then
            SUFFIX_RAW="${VERSION##*.}"
            HMM="${SUFFIX_RAW%%[a-z]*}"
            if (( HMM < 0 || HMM > 2359 )); then
              echo "::error::HMM suffix must be 0-2359, got $HMM"; exit 1
            fi
            PRERELEASE="true"
            if [[ "$VERSION" == *-alpha.* ]]; then
              CHANNEL="alpha"; NPM_TAG="alpha"
            else
              CHANNEL="beta"; NPM_TAG="beta"
            fi
          fi
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "✅ valid CalVer: $TAG (channel=$CHANNEL prerelease=$PRERELEASE)"

      - name: Fail loud on tag collision
        if: steps.ver.outputs.skip != 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error title=Tag collision::$TAG already exists. Two cuts in one hour? Use the 'alpha.Nb' collision suffix, or wait for the next hour."
            exit 1
          fi
          echo "✓ $TAG is free"

      - name: Install + compile + test
        if: steps.ver.outputs.skip != 'true'
        run: |
          bun install --frozen-lockfile
          bun run compile
          bun test __tests__/

      - name: Tag + GitHub release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          FLAGS="--generate-notes --title $TAG"
          if [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]]; then
            FLAGS="$FLAGS --prerelease"
          fi
          gh release create "$TAG" $FLAGS

      # GitHub is the release channel of record: every documented install path
      # reads this repo, not npm — `bunx --bun github:<org>/<repo>#alpha`, and
      # the Claude Code plugin marketplace (.claude-plugin/marketplace.json).
      # npm is a courtesy mirror for `npx` users without bun.
      #
      # So a dead/expired NPM_TOKEN must NOT fail the release: the tag and the
      # GitHub Release are already published by the steps above, and a red X on
      # every single cut trains you to ignore the one that actually matters
      # (that is exactly what happened on #462/#463/#464 — `npm 404 PUT` = the
      # token lacks publish rights, while tag v26.7.16 landed fine).
      # Two ways this can be a non-event, and BOTH must leave the run green:
      #   1. no NPM_TOKEN secret at all  → the `if:` below skips the step
      #   2. secret present but rejected → continue-on-error keeps the run green
      # (2) is the live case: the token exists but lacks publish rights, so npm
      # answers `404 PUT /arra-oracle-skills`. Guarding only on emptiness was
      # not enough — v26.7.25-alpha.1900 still went red with the tag + release
      # already published. Fix the token to resume publishing; nothing else
      # needs to change here.
      - name: Publish to npm
        if: steps.ver.outputs.skip != 'true' && env.NPM_TOKEN != ''
        continue-on-error: true
        id: npm_publish
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          # Note: compile + build already ran in the test step above.
          # Skipping prepublishOnly to avoid redundant work (per review).
          npm publish --access public --tag "${{ steps.ver.outputs.npm_tag }}"

      - name: Note npm publish skipped
        if: steps.ver.outputs.skip != 'true' && env.NPM_TOKEN == ''
        run: |
          echo "::notice::NPM_TOKEN not set — skipped npm publish. Tag + GitHub Release are live; install with: bunx --bun github:${{ github.repository }}#alpha"

      - name: Note npm publish failed
        if: steps.ver.outputs.skip != 'true' && steps.npm_publish.outcome == 'failure'
        run: |
          echo "::warning::npm publish FAILED (token rejected or registry error) — the release itself is fine. Tag + GitHub Release are live; install with: bunx --bun github:${{ github.repository }}#alpha"

      - name: Summary
        if: steps.ver.outputs.skip != 'true'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          echo "### 🎉 Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Channel:** ${{ steps.ver.outputs.npm_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release:** https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Install:** \`bunx --bun github:${{ github.repository }}#${{ github.ref_name }} install -g -y\`" >> "$GITHUB_STEP_SUMMARY"
          case "${{ steps.npm_publish.outcome }}" in
            success) echo "- **npm:** https://www.npmjs.com/package/arra-oracle-skills/v/${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY" ;;
            failure) echo "- **npm:** ⚠️ publish failed (token rejected) — GitHub is the release channel of record" >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "- **npm:** _skipped (no NPM_TOKEN) — GitHub is the release channel of record_" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
